<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>body{background:#07121e;color:#a9eaff;font:16px system-ui;max-width:650px;margin:auto;padding:20px}h1{text-align:center;letter-spacing:8px}button,input,textarea,select{font:inherit;color:inherit;background:#10283a;border:1px solid #36748c;border-radius:10px;padding:12px;box-sizing:border-box}input,textarea,select{width:100%;margin:6px 0}button{margin:4px;cursor:pointer}#log{min-height:180px;max-height:45vh;overflow:auto;white-space:pre-wrap}.orb{width:100px;height:100px;border:3px solid #63d9ff;border-radius:50%;margin:24px auto;box-shadow:0 0 30px #2484aa,inset 0 0 20px #2484aa;display:grid;place-items:center}small{color:#b0bec5}</style><h1>JARVIS</h1><div class="orb">ONLINE UI</div><details open><summary>Private setup</summary><input id="key" type="password" placeholder="DeepSeek API key" autocomplete="off"><small>Key stays in this page's memory; sent only to DeepSeek. Re-enter after reload. API usage may cost money.</small><select id="voice"></select><button id="test">Test voice</button></details><div id="log" role="log"></div><textarea id="q" placeholder="Ask JARVIS"></textarea><button id="send">Send</button><button id="mic">Microphone</button><button id="stop">Stop voice</button><button id="clear">Clear history</button><p id="status" role="status"></p><script>
const $=id=>document.getElementById(id);let history=[];try{history=JSON.parse(localStorage.getItem('jarvis-history')||'[]');if(!Array.isArray(history))history=[]}catch{};function render(){ $('log').textContent=history.map(m=>(m.role==='user'?'YOU: ':'JARVIS: ')+m.content).join('\n\n');$('log').scrollTop=$('log').scrollHeight}render();
function voices(){let vs=speechSynthesis.getVoices();$('voice').replaceChildren();vs.forEach((v,i)=>{let o=new Option(v.name+' ('+v.lang+')',i);$('voice').add(o)});let i=vs.findIndex(v=>v.lang==='en-GB'&&/male|daniel|george|ryan|arthur/i.test(v.name)&&!/female/i.test(v.name));if(i>=0)$('voice').value=i;else{let j=vs.findIndex(v=>v.lang==='en-GB');if(j>=0)$('voice').value=j}}voices();speechSynthesis.onvoiceschanged=voices;
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.voice=speechSynthesis.getVoices()[Number($('voice').value)]||null;u.lang=u.voice?.lang||'en-GB';u.pitch=.8;u.rate=.88;speechSynthesis.speak(u)}
$('test').onclick=()=>speak('At your service. All systems standing by.');$('stop').onclick=()=>speechSynthesis.cancel();$('clear').onclick=()=>{if(confirm('Clear conversation history?')){history=[];localStorage.removeItem('jarvis-history');render()}};
let busy=false;async function send(){if(busy)return;let q=$('q').value.trim(),key=$('key').value.trim();if(!key||!q){$('status').textContent='Enter your API key and a message.';return}busy=true;$('send').disabled=true;$('status').textContent='Thinking…';let next=[...history,{role:'user',content:q}];try{let r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:'You are JARVIS, a concise professional personal assistant. Be accurate, state uncertainty, never claim external actions you cannot perform. Require approval for sensitive actions.'},...next.slice(-30)],stream:false})});if(!r.ok)throw Error('DeepSeek HTTP '+r.status);let d=await r.json(),a=d.choices[0].message.content;history=[...next,{role:'assistant',content:a}];try{localStorage.setItem('jarvis-history',JSON.stringify(history))}catch{};$('q').value='';render();speak(a);$('status').textContent='Ready'}catch(e){$('status').textContent='Request failed: '+e.message+' (check key, balance, network and browser API access).'}finally{busy=false;$('send').disabled=false}}$('send').onclick=send;
$('mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='Speech recognition unavailable; use Samsung keyboard microphone.';return}let r=new R();r.lang='en-US';r.onresult=e=>{$('q').value=e.results[0][0].transcript;send()};r.onerror=e=>$('status').textContent='Microphone: '+e.error;try{r.start()}catch(e){$('status').textContent=e.message}};
</script></html>
